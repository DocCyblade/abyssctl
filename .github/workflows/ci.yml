name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: make tools
        run: make tools

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: make docs-check
        run: make docs-check

      - name: make build
        run: make build

      - name: Check every binary is statically linked
        run: |
          file dist/*
          for f in dist/*; do
            if ! file "$f" | grep -q 'statically linked'; then
              echo "::error file=$f::$f is not statically linked"
              exit 1
            fi
          done

      - name: Upload the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: junit.xml
          if-no-files-found: warn
